:root[data-workspace="personal"]{--workspace-ink:#1d2731;--workspace-muted:#45525d;--workspace-accent:#328cc1;--workspace-accent-strong:#083c5d;--workspace-accent-soft:#e5f2f9;--workspace-wash:#f0f5f8;--workspace-line:#d5e1e8;--workspace-neutral:#aaaaaa;--bg:#f0f5f8;--surface:#fff;--surface-2:#eaf1f5;--text:#1d2731;--muted:#45525d;--line:#d5e1e8;--blue:#328cc1;--blue-soft:#e5f2f9;--purple:#083c5d;--purple-soft:#e9eff3;--red:#a22c29;--red-soft:#f8e9e8;--orange:#d98310;--orange-soft:#fff2df}
body{background:var(--bg);color:var(--text)}
.sidebar{background:color-mix(in srgb,var(--surface) 91%,var(--workspace-wash));border-color:var(--line)}.avatar{background:var(--workspace-neutral);color:var(--text)}
.topbar{background:color-mix(in srgb,var(--surface) 88%,transparent);border-color:var(--line)}
.page-title,.task-name,.project-name,.panel-title,.stat-value,.drawer-head strong{color:var(--text)}
.page-subtitle,.breadcrumbs,.workspace-hint,.project-detail,.task-date,.meta-text,.panel-subtitle,.stat-top,.stat-caption,.field label,.form-help,.list-header{color:var(--muted)}
.nav-btn{color:var(--muted)}.nav-btn:hover{background:var(--surface-2);color:var(--text)}.nav-btn.active{background:var(--workspace-accent-soft);color:var(--workspace-accent-strong)}.nav-btn.active .nav-icon{color:var(--workspace-accent)}
.workspace-switch{background:var(--surface-2);border-color:var(--line)}.workspace-glyph{background:var(--workspace-accent-soft);color:var(--workspace-accent-strong)}.workspace-switch.personal .workspace-glyph{background:#e5f2f9;color:#083c5d}
.primary-btn{background:var(--workspace-accent-strong);border-color:var(--workspace-accent-strong);color:#fff}.primary-btn:hover{background:var(--workspace-accent);border-color:var(--workspace-accent)}
.secondary-btn,.search-trigger,.filter-select{color:var(--text);border-color:var(--line);background:var(--surface)}.secondary-btn:hover,.search-trigger:hover{background:var(--surface-2)}
.capture-bar,.stat-card,.panel,.list-panel,.project-card,.note-card,.settings-card,.detail-hero{background:var(--surface);border-color:var(--line)}
.capture-spark,.stat-icon,.empty-icon{background:var(--workspace-accent-soft);color:var(--workspace-accent-strong)}
.capture-bar input{color:var(--text)}.capture-bar input::placeholder{color:#6b7379}.capture-hint{color:var(--muted)}.capture-add{background:var(--workspace-accent-soft);color:var(--workspace-accent-strong)}
.task-name{color:var(--text)}.task-row{border-color:var(--workspace-line)}.task-row.is-done .task-name{color:#70777b}.task-date.overdue{color:#902923}
.status-chip,.workspace-chip,.tag-chip{background:#edf0f2;color:#303b43}.status-in-progress{background:#e5f2f9;color:#083c5d}.status-waiting{background:#fff2df;color:#804b00}.status-blocked{background:#f8e9e8;color:#902923}.status-completed{background:#e6f1eb;color:#24583d}
.workspace-chip.professional{background:#d6d5c9;color:#000}.workspace-chip.personal{background:#083c5d;color:#fff}
.segmented{background:var(--surface-2)}.segmented button{color:var(--muted)}.segmented button.active{color:var(--workspace-accent-strong)}
.field input,.field select,.field textarea{color:var(--text);border-color:var(--line)}.field input::placeholder,.field textarea::placeholder{color:#737d84}.field label{color:var(--text)}
.text-link{color:var(--workspace-accent-strong)}.text-link:hover{color:var(--workspace-accent)}.danger-btn{color:#902923;border-color:#e7c6c3;background:#fff7f6}.icon-btn{color:var(--muted)}
.row-actions,.project-card-actions{display:flex;align-items:center;gap:5px;flex:none}.row-action{border:1px solid var(--line);background:var(--surface);color:var(--workspace-accent-strong);border-radius:7px;padding:5px 8px;font-size:10px;font-weight:650;white-space:nowrap}.row-action:hover{background:var(--workspace-accent-soft);border-color:color-mix(in srgb,var(--workspace-accent) 35%,var(--line))}.row-action.danger{color:#902923}.row-action.danger:hover{background:#f8e9e8;border-color:#e7c6c3}.project-card-top{gap:8px}.project-card-actions{margin-left:auto}.project-card{cursor:default}.project-card:hover{transform:translateY(-1px)}.project-card h3{color:var(--text)}.project-card p,.project-card-foot{color:var(--muted)}.project-row{gap:10px}
/* Calendar & Timeline planner */

.cal-event-kind{font-size:7px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;opacity:.82}.cal-event.due-event,.cal-event.due-event{border-left-color:#d98310;background:#fff2df;color:#704300}.cal-event.due-event small{color:#805b28}.cal-event.project-event{border-left-color:#a22c29;background:#f8e9e8;color:#70231f}.cal-event.project-event small{color:#75413e}.cal-more{border:0;background:transparent;text-align:left;font-size:8px;color:var(--workspace-accent-strong);padding:2px 4px}.selected-day-panel{min-height:260px}.selected-day-events{padding:0 12px 12px;display:flex;flex-direction:column;gap:7px}.selected-day-events .cal-event{padding:9px 10px}.selected-day-events .cal-event strong{font-size:11px}.selected-day-events .cal-event small{font-size:9px}.selected-day-events .cal-event-kind{font-size:8px}.calendar-week-grid{display:grid;grid-template-columns:repeat(7,minmax(125px,1fr));overflow-x:auto;border-top:1px solid var(--line)}.calendar-week-day{min-height:250px;border-right:1px solid var(--line);padding:9px 7px}.calendar-week-day.selected{background:var(--workspace-accent-soft)}.calendar-week-heading{width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);padding:5px;margin-bottom:9px}.calendar-week-heading strong{font-size:19px;color:var(--text)}.calendar-week-day.is-today .calendar-week-heading strong{background:var(--workspace-accent-strong);color:white;border-radius:50%;width:30px;height:30px;display:grid;place-items:center}.calendar-week-events{display:flex;flex-direction:column;gap:6px}.calendar-no-events{font-size:9px;color:#899197;text-align:center;padding:15px 0}.agenda-event{width:100%;border:0;border-left:3px solid #328cc1;border-radius:0 7px 7px 0;background:#e8f3f9;color:#083c5d;text-align:left;padding:9px 11px;display:flex;flex-direction:column;gap:3px}.agenda-event.due-event{border-left-color:#d98310;background:#fff2df;color:#704300}.agenda-event span{font-size:8px;text-transform:uppercase;font-weight:800}.agenda-event strong{font-size:11px}.agenda-event small{font-size:9px;color:#4e606b}.calendar-legend{display:flex;gap:18px;flex-wrap:wrap;padding:13px 2px;color:var(--muted);font-size:9px}.calendar-legend span{display:flex;align-items:center;gap:6px}.legend-dot{width:8px;height:8px;border-radius:3px;display:inline-block}.legend-dot.scheduled{background:#328cc1}.legend-dot.due{background:#d98310}.legend-dot.project{background:#a22c29}.gantt-wrap{overflow-x:auto;padding-bottom:8px}.gantt-axis,.gantt-row{display:grid;grid-template-columns:250px minmax(620px,1fr);min-width:870px}.gantt-axis{position:relative;top:auto;background:var(--surface);z-index:1;border-bottom:1px solid var(--line)}.gantt-label-head{font-size:9px;font-weight:800;color:var(--muted);padding:11px 13px}.gantt-axis-days{display:grid;grid-template-columns:repeat(var(--day-count),minmax(0,1fr));border-left:1px solid var(--line)}.gantt-day{font-size:8px;color:#66727a;text-align:left;padding:11px 0 9px 3px;border-left:1px solid #edf0f2;min-width:0}.gantt-day.week-start{font-weight:800;color:var(--workspace-accent-strong)}.gantt-row{min-height:43px;border-bottom:1px solid var(--line)}.gantt-label{display:flex;align-items:center;gap:8px;min-width:0;padding:7px 10px}.gantt-type{font-size:7px;font-weight:800;letter-spacing:.4px;color:#6e777d;background:#eef0f1;border-radius:4px;padding:3px 4px;flex:none}.gantt-type.project{color:#902923;background:#f8e9e8}.gantt-label button{border:0;background:transparent;text-align:left;color:var(--text);font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 0;min-width:0}.gantt-track{position:relative;min-height:43px;border-left:1px solid var(--line);background-image:linear-gradient(to right,#edf0f2 1px,transparent 1px);background-size:calc(100% / var(--day-count)) 100%;background-position:left top}.gantt-bar{position:absolute;top:10px;height:22px;border:0;border-radius:5px;background:#328cc1;color:white;padding:0 7px;text-align:left;overflow:hidden;white-space:nowrap;font-size:8px;font-weight:700;min-width:4px}.gantt-bar.project-bar{background:#902923}.gantt-bar.completed-bar{opacity:.5}.gantt-bar span{display:block;overflow:hidden;text-overflow:ellipsis}.gantt-empty{padding:30px 18px;color:var(--muted);font-size:11px;text-align:center}.gantt-footnote{font-size:9px;color:var(--muted);padding:0 15px 12px}.calendar-list{padding:4px 18px 15px}.calendar-day{align-items:start}.calendar-date{color:var(--text)}
@media(max-width:1050px){.calendar-layout{grid-template-columns:1fr}.cal-day{min-height:95px}}
@media(max-width:760px){.planner-toolbar{align-items:flex-start;flex-direction:column}.calendar-month-grid{min-width:590px}.calendar-panel{overflow-x:auto}.cal-day{min-height:88px;padding:3px}.cal-event{padding:3px}.cal-event small{display:none}.planner-modes button{padding:6px 8px}.row-action{padding:5px 6px}}


/* Workspace-specific semantic use of the supplied palettes */
:root[data-workspace="professional"] .gantt-bar{background:#a22c29}
:root[data-workspace="professional"] .gantt-bar.project-bar{background:#902923}
:root[data-workspace="professional"] .cal-event{border-left-color:#a22c29;background:#f7e9e8;color:#902923}
:root[data-workspace="professional"] .cal-event small{color:#55564f}
:root[data-workspace="professional"] .cal-event.due-event{border-left-color:#902923;background:#eeeae2;color:#000}
:root[data-workspace="professional"] .cal-event.project-event{border-left-color:#b9baa3;background:#eeede6;color:#000}
:root[data-workspace="professional"] .agenda-event{border-left-color:#a22c29;background:#f7e9e8;color:#902923}
:root[data-workspace="professional"] .agenda-event.due-event{border-left-color:#902923;background:#eeeae2;color:#000}
:root[data-workspace="personal"] .gantt-bar{background:#328cc1}
:root[data-workspace="personal"] .gantt-bar.project-bar{background:#083c5d}
:root[data-workspace="personal"] .cal-event.project-event{border-left-color:#083c5d;background:#e9eff3;color:#083c5d}
.workspace-copy{display:flex;flex-direction:column;gap:2px}
.page-subtitle{font-size:13px}.meta-text,.task-date{font-size:11px}.stat-top{font-size:12px}.stat-caption,.panel-subtitle{font-size:11px}.project-card p{font-size:11px}.project-card-foot{font-size:11px}.cal-event strong{font-size:10px}.cal-event small{font-size:9px}.cal-event-kind{font-size:8px}.gantt-label button{font-size:11px}


/* FOCUS 1.0.4 — interactive timeline, weekly plan and project health */
.overview-calendar-panel{margin:0 0 20px;overflow:visible}
.overview-calendar-head{align-items:flex-start;gap:16px;flex-wrap:wrap;padding:16px 18px 13px}
.overview-calendar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.overview-calendar-actions .calendar-controls{gap:5px}
.overview-calendar-actions .calendar-controls .secondary-btn{padding:7px 10px;min-width:34px}
.overview-calendar-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(235px,.75fr);gap:14px;padding:0 14px 14px;align-items:stretch}
.overview-calendar-main{min-width:0}
.overview-calendar-period{font-size:12px;font-weight:700;color:var(--text);padding:3px 3px 10px}
.overview-calendar-grid{min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.overview-calendar-grid .cal-day{min-height:82px;padding:4px}
.overview-calendar-grid .cal-weekday{padding:7px 2px;font-size:9px}
.overview-calendar-grid .cal-event{padding:4px 5px}
.overview-calendar-grid .cal-event-kind{font-size:7px}
.overview-calendar-grid .cal-event strong{font-size:9px}
.overview-calendar-grid .cal-event small{display:none}
.overview-calendar-grid .cal-more{font-size:8px}
.overview-calendar-grid .calendar-month-grid{border:0}
.overview-calendar-grid .calendar-week-grid{grid-template-columns:repeat(7,minmax(0,1fr));min-width:0;overflow:visible;border:0}
.overview-calendar-grid .calendar-week-day{min-width:0;min-height:170px;padding:7px 4px;border-bottom:0}
.overview-calendar-grid .calendar-week-heading{padding:4px 1px;margin-bottom:5px}
.overview-calendar-grid .calendar-week-heading strong{font-size:16px}
.overview-calendar-grid .calendar-week-events{gap:4px}
.overview-calendar-grid .calendar-no-events{font-size:8px}
.overview-calendar-grid .cal-event small{display:none}
.overview-calendar-main .calendar-legend{padding:10px 2px 0;gap:12px;font-size:9px}
.overview-day-panel{display:flex;flex-direction:column;min-height:100%;overflow:hidden}
.overview-day-panel .panel-head{padding:14px 14px 10px}
.overview-day-events{padding:0 10px 10px;display:flex;flex-direction:column;gap:7px;flex:1}
.overview-day-events .cal-event{padding:9px 10px}
.overview-day-events .cal-event strong{font-size:11px}
.overview-day-events .cal-event small{font-size:9px}
.overview-day-events .cal-event-kind{font-size:8px}
.overview-day-panel .empty-state{padding:22px 13px}
.overview-open-calendar{margin:0 12px 11px;text-align:left;border-top:1px solid var(--line);padding:11px 2px 0}
.task-view-switch{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 15px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:-8px 0 14px}
.task-view-switch>div:first-child{display:flex;flex-direction:column;gap:2px}
.task-view-switch strong{font-size:12px;color:var(--text)}
.task-view-switch span{font-size:10px;color:var(--muted)}
.task-view-switch .segmented{flex:none}
.task-filter-tabs{flex-wrap:wrap}
.board-result-count{font-size:10px;color:var(--muted);font-weight:650;margin:-2px 0 9px}
.task-board-help{display:flex;align-items:center;gap:10px;padding:10px 13px;margin:0 0 12px;border:1px solid color-mix(in srgb,var(--workspace-accent) 24%,var(--line));background:var(--workspace-accent-soft);color:var(--text);border-radius:10px;font-size:10px}
.task-board-help strong{font-size:10px}
.drag-hint-icon{font-size:20px;line-height:1;color:var(--workspace-accent-strong)}
.task-board{display:grid;grid-template-columns:repeat(5,minmax(205px,1fr));gap:10px;overflow-x:auto;padding:1px 1px 12px;align-items:start}
.task-board-column{min-width:205px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;min-height:330px;padding:9px;transition:background .15s,border-color .15s,box-shadow .15s}
.task-board-column.drop-target{background:var(--workspace-accent-soft);border-color:var(--workspace-accent);box-shadow:inset 0 0 0 1px var(--workspace-accent)}
.task-board-column-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 2px 10px}
.task-board-column-name{display:flex;align-items:center;gap:7px;min-width:0}
.task-board-column-name strong{font-size:11px;white-space:nowrap}
.task-board-count{font-size:9px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:2px 6px;border-radius:20px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#a0a0a0;flex:none}
.status-dot.status-in-progress{background:#328cc1}
.status-dot.status-waiting{background:#d98310}
.status-dot.status-blocked{background:#a22c29}
.status-dot.status-completed{background:#438a69}
.task-board-column-body{display:flex;flex-direction:column;gap:8px;min-height:280px}
.task-board-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 2px 5px rgba(20,25,30,.035);cursor:grab;transition:opacity .12s,transform .12s,border-color .12s;user-select:none}
.task-board-card:hover{border-color:color-mix(in srgb,var(--workspace-accent) 52%,var(--line));transform:translateY(-1px)}
.task-board-card:active{cursor:grabbing}
.task-board-card.is-dragging{opacity:.42;transform:rotate(1deg)}
.board-card-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.priority-label{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--muted)}
.board-open{width:24px;height:24px;font-size:13px}
.board-card-title{display:block;width:100%;text-align:left;border:0;background:transparent;padding:4px 0 8px;color:var(--text);font-size:11px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.board-card-title:hover{color:var(--workspace-accent-strong)}
.board-card-project{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:9px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-card-project .project-dot{width:7px;height:7px}
.board-card-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.board-card-foot>span{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-card-foot>span.overdue{color:#a22c29;font-weight:700}
.board-status-label{max-width:112px;flex:none}
.board-status-select{max-width:112px;width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:9px;border-radius:6px;padding:5px 18px 5px 6px;cursor:pointer}
.board-empty{border:1px dashed var(--line);border-radius:8px;padding:18px 8px;text-align:center;color:#9a9ba3;font-size:9px;min-height:68px;display:grid;place-items:center}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.planner-view-tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.planner-calendar-group{display:flex;align-items:center;gap:8px;padding-right:8px;border-right:1px solid var(--line)}
.planner-group-label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.planner-tab{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:7px 11px;font-size:11px;font-weight:650}

(()=>{'use strict';
const DB_NAME='focus-command-center',DB_VERSION=1,STORE='app';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const dateOffset=n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateObj=s=>s?new Date(`${s}T12:00:00`):null;

const fmtLong=s=>{const d=dateObj(s);return d?d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}):''};
const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDaysISO=(s,n)=>{const d=dateObj(s)||dateObj(today());d.setDate(d.getDate()+n);return isoDay(d)};
const addMonthsISO=(s,n)=>{const d=dateObj(s)||dateObj(today());d.setDate(1);d.setMonth(d.getMonth()+n);return isoDay(d)};
const startOfWeek=s=>{const d=dateObj(s)||dateObj(today());d.setDate(d.getDate()-((d.getDay()+6)%7));return isoDay(d)};
const daysInMonth=s=>{const d=dateObj(s)||dateObj(today());return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};
const daysBetween=(a,b)=>Math.round((dateObj(b)-dateObj(a))/86400000);

const humanToday=()=>new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const uid=()=>crypto.randomUUID?crypto.randomUUID():`id_${Date.now()}_${Math.random().toString(36).slice(2)}`;

function createEmptyWorkspace(){const s=defaults();delete s.demoData;return s;}
function migrateLegacyDemoRecords(value){
 if(!value||typeof value!=='object'||!value.settings)return false;
 if(value.settings.realUseCleanupVersion>=1)return false;
 const seedProjectNames={p_focus:'This is project name',p_example:'Example Project',p_hello:'Hello World',p_try:'Try This Project'};
 const seedTaskTitles={t1:'Review this example',t2:'Test drag and drop',t3:'Finish this later',t4:'Prepare first checkpoint',t5:'Write something here',t6:'Try moving me',t7:'Something to remember',t8:'Example task',t9:'Hello',t10:'This is a sample task',t11:'Review the project outline',t12:'Plan the next small step'};
 const seedNoteTitles={n1:'Hello World',n2:'This is an example note'};
 const seedMilestoneTitles={m_focus_1:'Planning signed off',m_focus_2:'First working review',m_hello_1:'Checkpoint delivery'};
 const removedProjectIds=new Set((Array.isArray(value.projects)?value.projects:[]).filter(p=>seedProjectNames[p.id]===p.name).map(p=>p.id));

 const removedNoteIds=new Set((Array.isArray(value.notes)?value.notes:[]).filter(n=>seedNoteTitles[n.id]===n.title).map(n=>n.id));
 const removedMilestoneIds=new Set((Array.isArray(value.milestones)?value.milestones:[]).filter(m=>seedMilestoneTitles[m.id]===m.title).map(m=>m.id));
 const removedPhaseIds=new Set();
 (Array.isArray(value.projects)?value.projects:[]).filter(p=>removedProjectIds.has(p.id)).forEach(p=>(p.phases||[]).forEach(ph=>removedPhaseIds.add(ph.id)));
 const seedPhaseIdsByProject={p_focus:['phase_focus_discovery','phase_focus_build','phase_focus_review'],p_hello:['phase_hello_plan','phase_hello_delivery']};
 removedProjectIds.forEach(pid=>(seedPhaseIdsByProject[pid]||[]).forEach(id=>removedPhaseIds.add(id)));
 value.projects=(Array.isArray(value.projects)?value.projects:[]).filter(p=>!removedProjectIds.has(p.id));
 value.tasks=(Array.isArray(value.tasks)?value.tasks:[]).filter(t=>!removedTaskIds.has(t.id)).map(t=>{if(removedProjectIds.has(t.projectId))t.projectId=null;if(removedPhaseIds.has(t.phaseId))delete t.phaseId;return t;});
 value.notes=(Array.isArray(value.notes)?value.notes:[]).filter(n=>!removedNoteIds.has(n.id)).map(n=>{if(removedProjectIds.has(n.projectId))n.projectId=null;return n;});

 value.activity=(Array.isArray(value.activity)?value.activity:[]).filter(a=>!['Example Project created','A sample task completed'].includes(a.label));
 const cleanMap=(map)=>{if(!map||typeof map!=='object')return {};const next={};Object.entries(map).forEach(([k,v])=>{if(Array.isArray(v)){const filtered=v.filter(id=>!removedTaskIds.has(id));if(filtered.length)next[k]=filtered;}else next[k]=v;});return next;};

let state=null,db=null,storageMode='Checking',memorySnapshot=null,activeView='overview',workspaceFilter='all',taskFilter='all',inboxFilter='unprocessed',projectTab='Tasks',activeProjectId=null,activeProjectView='overview',activeTaskId=null,searchQuery='',projectSearch='',taskSearch='',undoSnapshot=null,calendarMode='week',calendarCursor=today(),selectedCalendarDate=today(),taskLayout='board',taskProjectFilter='all',taskStatusFilter='all',dashboardCalendarMode='week',draggingTaskId=null,calendarDraggedItem=null,weeklyCursor=today(),dailyCursor=today(),timelinePointer=null;
const TAB_STATE_PREFIX='FOCUS_TAB_STATE_V1:';
function validStoredState(value){return !!value&&typeof value==='object'&&value.version===1&&Array.isArray(value.projects)&&Array.isArray(value.tasks)&&Array.isArray(value.notes)&&Array.isArray(value.workspaces);}
function parseStoredState(raw){try{const value=JSON.parse(raw);return validStoredState(value)?value:null;}catch(e){return null;}}
function getBrowserStorage(kind){try{return window[kind]||null;}catch(e){return null;}}
function readTabState(){try{if(typeof window.name==='string'&&window.name.startsWith(TAB_STATE_PREFIX))return parseStoredState(window.name.slice(TAB_STATE_PREFIX.length));}catch(e){}return null;}
function writeTabState(value){try{if(!window.name||window.name.startsWith(TAB_STATE_PREFIX)){window.name=TAB_STATE_PREFIX+JSON.stringify(value);return true;}}catch(e){}return false;}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(new Error('IndexedDB unavailable'));const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Could not open local database'));req.onblocked=()=>reject(new Error('Database upgrade is blocked'));});}
async function dbGet(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get('main');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);tx.onabort=()=>reject(tx.error||new Error('Database read aborted'));});}
async function dbPut(value){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,'main');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Save failed'));tx.onabort=()=>reject(tx.error||new Error('Save aborted'));});}
async function storeInitialState(value){
 if(db){try{await dbPut(value);storageMode='IndexedDB';memorySnapshot=value;return;}catch(e){try{db.close();}catch(err){}db=null;}}
 const local=getBrowserStorage('localStorage');if(local){try{local.setItem(DB_NAME,JSON.stringify(value));storageMode='Local storage';memorySnapshot=value;return;}catch(e){}}
 const session=getBrowserStorage('sessionStorage');if(session){try{session.setItem(DB_NAME,JSON.stringify(value));storageMode='Session storage';memorySnapshot=value;return;}catch(e){}}
 if(writeTabState(value)){storageMode='Tab session';memorySnapshot=value;return;}

function projectHealth(p){
 const all=projectTasks(p.id).filter(t=>t.status!=='Cancelled');
 const open=all.filter(t=>t.status!=='Completed');
 const overdue=open.filter(t=>t.dueDate&&t.dueDate<today());
 const blocked=open.filter(t=>t.status==='Blocked');
 const dueSoon=open.filter(t=>t.dueDate&&t.dueDate>=today()&&t.dueDate<=dateOffset(7));
 const targetOverdue=p.targetDate&&p.targetDate<today()&&p.status!=='Completed';
 const targetSoon=p.targetDate&&p.targetDate>=today()&&p.targetDate<=dateOffset(7)&&p.status!=='Completed';
 const milestones=(state.milestones||[]).filter(m=>m.projectId===p.id&&m.status!=='Completed');
 const overdueMilestones=milestones.filter(m=>m.date&&m.date<today());
 const soonMilestones=milestones.filter(m=>m.date&&m.date>=today()&&m.date<=dateOffset(7));
 let label='On track',tone='good',reasons=[];
 if(p.status==='Completed'){label='Completed';tone='neutral';reasons.push('Project is marked completed.');}
 else if(p.status==='Cancelled'){label='Cancelled';tone='neutral';reasons.push('Project is marked cancelled.');}
 else if(overdue.length||targetOverdue||overdueMilestones.length||blocked.length>=2){label='At risk';tone='risk';if(overdue.length)reasons.push(`${overdue.length} overdue task${overdue.length===1?'':'s'}`);if(overdueMilestones.length)reasons.push(`${overdueMilestones.length} overdue milestone${overdueMilestones.length===1?'':'s'}`);if(targetOverdue)reasons.push('Project target date has passed');if(blocked.length>=2)reasons.push(`${blocked.length} blocked tasks`);}
 else if(blocked.length||dueSoon.length||soonMilestones.length||targetSoon){label='Needs attention';tone='attention';if(blocked.length)reasons.push(`${blocked.length} blocked task${blocked.length===1?'':'s'}`);if(dueSoon.length)reasons.push(`${dueSoon.length} deadline${dueSoon.length===1?'':'s'} in the next 7 days`);if(soonMilestones.length)reasons.push(`${soonMilestones.length} milestone${soonMilestones.length===1?'':'s'} in the next 7 days`);if(targetSoon)reasons.push('Project target is within 7 days');}
 else if(!all.length&&!p.startDate&&!p.targetDate){label='No signals yet';tone='neutral';reasons.push('Add tasks or dates to evaluate project health.');}
 else reasons.push('No overdue tasks, blocked work, or deadlines within 7 days.');
 return {label,tone,reasons,overdue:overdue.length,blocked:blocked.length,dueSoon:dueSoon.length,overdueMilestones:overdueMilestones.length,soonMilestones:soonMilestones.length,targetOverdue:!!targetOverdue,targetSoon:!!targetSoon};
}

function allCalendarEvents(){
 const out=[];
 const add=(item)=>{if(item&&item.date)out.push(item);};
 visibleTasks().forEach(t=>{
  const project=taskProjectName(t),status=t.status||'Not Started';
  add({type:'task',id:t.id,field:'startDate',date:t.startDate,title:t.title,kind:'Task start',status,project});
  add({type:'task',id:t.id,field:'scheduledDate',date:t.scheduledDate,title:t.title,kind:'Scheduled',status,project});
  add({type:'task',id:t.id,field:'dueDate',date:t.dueDate,title:t.title,kind:'Due',status,project});
  add({type:'task',id:t.id,field:'followUpDate',date:t.followUpDate,title:t.title,kind:'Follow-up',status,project});
 });
 visibleProjects().forEach(p=>{
  add({type:'project',id:p.id,field:'startDate',date:p.startDate,title:p.name,kind:'Project start',status:p.status,project:p.name});
  add({type:'project',id:p.id,field:'targetDate',date:p.targetDate,title:p.name,kind:'Project deadline',status:p.status,project:p.name});
  (p.phases||[]).filter(ph=>!ph.archived).forEach(ph=>{
   add({type:'phase',id:ph.id,projectId:p.id,field:'startDate',date:ph.startDate,title:ph.name,kind:'Phase start',status:'Phase',project:p.name});
   add({type:'phase',id:ph.id,projectId:p.id,field:'endDate',date:ph.endDate,title:ph.name,kind:'Phase end',status:'Phase',project:p.name});
  });
 });
 (state.milestones||[]).forEach(m=>{
  const p=getProject(m.projectId);
  if(p&&!p.archived&&(workspaceFilter==='all'||p.workspaceId===workspaceFilter))
   add({type:'milestone',id:m.id,projectId:m.projectId,field:'date',date:m.date,title:m.title,kind:'Milestone',status:m.status||'Upcoming',project:p.name});
 });
 return out.sort((a,b)=>a.date.localeCompare(b.date)||calendarEventRank(a)-calendarEventRank(b)||a.title.localeCompare(b.title));
}
function calendarEventRank(x){return ({'Due':0,'Project deadline':1,'Follow-up':2,'Milestone':3,'Phase end':4,'Scheduled':5,'Task start':6,'Project start':7,'Phase start':8})[x.kind]??9;}
function calendarEventsForDate(day){return allCalendarEvents().filter(x=>x.date===day);}
function calendarEventAction(ev){return ev.type==='project'?'open-project':ev.type==='milestone'?'edit-milestone':ev.type==='phase'?'open-project-phase':'open-task';}
function calendarEventButton(ev,extraClass=''){
 const dragAttrs=`draggable="true" data-calendar-drag-item="true" data-calendar-item-type="${esc(ev.type)}" data-calendar-item-id="${esc(ev.id)}" data-calendar-item-field="${esc(ev.field)}" ${ev.projectId?`data-calendar-project-id="${esc(ev.projectId)}"`:''} title="Drag to move ${esc(ev.kind.toLowerCase())}. Only this date changes."`;
 const classes=['cal-event',extraClass,ev.type==='project'?'project-event':'',ev.type==='milestone'?'milestone-event':'',ev.type==='phase'?'phase-event':'',ev.kind==='Due'||ev.kind==='Project deadline'?'due-event':'',ev.kind==='Follow-up'?'follow-up-event':'',ev.kind.includes('start')?'start-event':''].filter(Boolean).join(' ');
 return `<button class="${classes}" ${dragAttrs} data-action="${calendarEventAction(ev)}" data-id="${esc(ev.id)}" ${ev.projectId?`data-project="${esc(ev.projectId)}"`:''}><span class="cal-event-kind">${esc(ev.kind)}</span><strong>${esc(ev.title)}</strong><small>${esc(ev.project)} · ${esc(ev.status)} · Drag to move date</small></button>`;
}
function renderCalendarMonth(){
 const first=dateObj(`${calendarCursor.slice(0,7)}-01`),start=startOfWeek(isoDay(first)),days=42;
 const headers=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="cal-weekday">${x}</div>`).join('');
 const cells=Array.from({length:days},(_,i)=>{
  const day=addDaysISO(start,i),d=dateObj(day),events=calendarEventsForDate(day),outside=d.getMonth()!==first.getMonth();
  return `<section class="cal-day ${outside?'outside-month':''} ${day===selectedCalendarDate?'selected':''} ${day===today()?'is-today':''}" data-calendar-drop-date="${day}"><button class="cal-day-number" data-action="select-calendar-date" data-date="${day}" aria-label="Select ${fmtLong(day)}">${d.getDate()}</button><div class="cal-day-events">${events.slice(0,3).map(ev=>calendarEventButton(ev)).join('')}${events.length>3?`<button class="cal-more" data-action="select-calendar-date" data-date="${day}">+${events.length-3} more</button>`:''}</div></section>`;
 }).join('');
 return `<div class="calendar-month-grid">${headers}${cells}</div>`;
}

function timelineBar(item,days,monthStart,kind){

 const monthEnd=addDaysISO(monthStart,days-1);
 if(rawEnd<monthStart||rawStart>monthEnd)return '';
 const visibleStart=rawStart<monthStart?monthStart:rawStart,visibleEnd=rawEnd>monthEnd?monthEnd:rawEnd;
 const left=daysBetween(monthStart,visibleStart),span=daysBetween(visibleStart,visibleEnd)+1;
 const leftPct=left/days*100,widthPct=span/days*100;
 const title=`${item.title} · ${fmtDate(rawStart)}${rawEnd!==rawStart?' – '+fmtDate(rawEnd):''}`;
 const startLabel=kind==='project'?'Resize project start':'Resize task start';

}
function renderVisualTimeline(){

 let elapsed=0;
 const monthAxis=months.map(m=>{const width=m.count/days*100;const html=`<span class="gantt-year-month" style="width:${width}%">${m.label}</span>`;elapsed+=m.count;return html;}).join('');
 const monthLines=months.slice(1).map(m=>`<i class="gantt-year-month-line" style="left:${daysBetween(yearStart,m.start)/days*100}%"></i>`).join('');
 const collapsed=new Set(Array.isArray(state.settings.collapsedTimelineProjects)?state.settings.collapsedTimelineProjects:[]);

 const taskRow=(t)=>{
  const start=t.startDate||t.scheduledDate||t.dueDate||'';
  const end=t.dueDate||start;
  const inYear=start&&end&&start<=yearEnd&&end>=yearStart;
  const item={id:t.id,title:t.title,status:t.status,startDate:start,scheduledDate:t.scheduledDate,dueDate:t.dueDate};
  const bar=inYear?timelineBar(item,days,yearStart,'task'):'';

  return `<div class="gantt-year-row task" data-plan-task="${esc(t.id)}"><div class="gantt-year-label task"><span class="gantt-type task">TASK</span><button title="${esc(t.title)}" data-action="open-task" data-id="${esc(t.id)}">${esc(t.title)}</button><span class="gantt-year-task-status">${esc(t.status)}</span><span class="gantt-year-task-date">${esc(dateText)}</span></div><div class="gantt-year-track">${monthLines}${bar}</div></div>`;
 };
 const projectGroups=allProjects.map(p=>{

   const ad=a.startDate||a.scheduledDate||a.dueDate||'9999-12-31',bd=b.startDate||b.scheduledDate||b.dueDate||'9999-12-31';return ad.localeCompare(bd)||a.title.localeCompare(b.title);
  });
  const start=p.startDate||p.targetDate||'',end=p.targetDate||start;
  const inYear=start&&end&&start<=yearEnd&&end>=yearStart;

  const milestoneMarkers=(state.milestones||[]).filter(m=>m.projectId===p.id&&m.status!=='Completed'&&m.date>=yearStart&&m.date<=yearEnd).map(m=>`<button class="gantt-milestone-dot" data-action="edit-milestone" data-id="${esc(m.id)}" style="left:${daysBetween(yearStart,m.date)/days*100}%" title="${esc(m.title)} · ${fmtDate(m.date)}" aria-label="Edit milestone ${esc(m.title)}">◆</button>`).join('');

}

function timelineCandidateDates(ctx,delta){
 let start=ctx.start,end=ctx.end;
 if(ctx.operation==='move'){start=addDaysISO(ctx.start,delta);end=addDaysISO(ctx.end,delta);}
 else if(ctx.operation==='start'){start=addDaysISO(ctx.visibleStart,delta);if(start>end)start=end;}
 else if(ctx.operation==='end'){end=addDaysISO(ctx.visibleEnd,delta);if(end<start)end=start;}
 return {start,end};
}
function previewTimelineBar(ctx,delta){
 const dates=timelineCandidateDates(ctx,delta),monthEnd=addDaysISO(ctx.monthStart,ctx.days-1);
 const leftDate=dates.start<ctx.monthStart?ctx.monthStart:dates.start,rightDate=dates.end>monthEnd?monthEnd:dates.end;
 if(dates.end<ctx.monthStart||dates.start>monthEnd||rightDate<leftDate){ctx.bar.style.opacity='.18';ctx.bar.style.width='0%';return;}
 const left=daysBetween(ctx.monthStart,leftDate),width=daysBetween(leftDate,rightDate)+1;
 ctx.bar.style.left=`${left/ctx.days*100}%`;ctx.bar.style.width=`${width/ctx.days*100}%`;ctx.bar.style.opacity='1';
}
async function commitTimelineEdit(ctx,delta){
 if(!delta)return;
 const dates=timelineCandidateDates(ctx,delta),item=ctx.kind==='project'?getProject(ctx.id):getTask(ctx.id);
 if(!item)return;
 if(ctx.kind==='project'){
  if(ctx.operation==='move'){
   if(item.startDate)item.startDate=addDaysISO(item.startDate,delta);
   if(item.targetDate)item.targetDate=addDaysISO(item.targetDate,delta);
  }else if(ctx.operation==='start')item.startDate=dates.start;
  else item.targetDate=dates.end;
 }else{
  if(ctx.operation==='move'){
   if(item.startDate)item.startDate=addDaysISO(item.startDate,delta);
   if(item.scheduledDate)item.scheduledDate=addDaysISO(item.scheduledDate,delta);
   if(!item.startDate&&!item.scheduledDate&&!item.dueDate)item.startDate=dates.start;
   if(item.dueDate)item.dueDate=addDaysISO(item.dueDate,delta);
  }else if(ctx.operation==='start'){
   if(item.startDate)item.startDate=dates.start;
   else if(item.scheduledDate)item.scheduledDate=dates.start;
   else item.startDate=dates.start;
  }else item.dueDate=dates.end;
 }
 activity('updated',`Adjusted ${ctx.kind} dates · ${item.name||item.title}`);
 await commit(`${ctx.kind==='project'?'Project':'Task'} dates updated`);
 render();
}
function timelineContext(bar,operation,clientX){

 return {bar,id:bar.dataset.id,kind:bar.dataset.kind,operation,start:bar.dataset.start,end:bar.dataset.end,visibleStart:bar.dataset.visibleStart,visibleEnd:bar.dataset.visibleEnd,monthStart:bar.dataset.monthStart,days,dayWidth:rect.width/days,startX:clientX,delta:0};
}

 <div class="daily-date-toolbar"><div class="calendar-controls"><button class="secondary-btn" data-action="daily-prev" aria-label="Previous day">‹</button><button class="secondary-btn" data-action="daily-today">Today</button><button class="secondary-btn" data-action="daily-next" aria-label="Next day">›</button></div><strong>${fmtLong(day)}</strong><span class="daily-date-note">Daily focus is saved separately for each date.</span></div>

function openTaskInProjectPlan(id){

 const year=rawDate.slice(0,4);calendarMode='timeline';calendarCursor=`${year}-01-01`;selectedCalendarDate=calendarCursor;
 activeView='timeline';activeProjectId=null;

 state.settings.collapsedTimelineProjects=collapsed;
 persist();render();animatePage();closeMobileSidebar();window.scrollTo({top:0,behavior:'smooth'});
 requestAnimationFrame(()=>{
  const taskRow=Array.from(document.querySelectorAll('[data-plan-task]')).find(row=>row.dataset.planTask===id);

 });

function resolveCalendarDragTarget(item){

 const allowed={task:['startDate','scheduledDate','dueDate','followUpDate'],project:['startDate','targetDate'],milestone:['date'],phase:['startDate','endDate']};
 if(!allowed[item.type]?.includes(item.field))return null;
 if(item.type==='task')return getTask(item.id);
 if(item.type==='project')return getProject(item.id);
 if(item.type==='milestone')return (state.milestones||[]).find(x=>x.id===item.id)||null;
 if(item.type==='phase'){
  const p=getProject(item.projectId);if(!p)return null;
  const phase=(p.phases||[]).find(x=>x.id===item.id&&!x.archived);
  return phase||null;
 }
 return null;
}

}

 if(item.type==='task'){
  if(item.field==='scheduledDate'&&target.dueDate&&targetDate>target.dueDate)warning='The scheduled date is now after its due date. The due date was not changed.';
  if(item.field==='dueDate'&&target.scheduledDate&&targetDate<target.scheduledDate)warning='The deadline is now before its scheduled date. The scheduled date was not changed.';
  if(item.field==='startDate'&&target.dueDate&&targetDate>target.dueDate)warning='The task start date is now after its due date. The due date was not changed.';
 }
 if(item.type==='project'&&item.field==='startDate'&&target.targetDate&&targetDate>target.targetDate)warning='The project start is now after its target date. The target date was not changed.';
 if(item.type==='phase'){
  const phase=(getProject(item.projectId)?.phases||[]).find(x=>x.id===item.id);
  if(phase&&phase.startDate&&phase.endDate&&phase.startDate>phase.endDate)warning='The phase start is now after its end date. The other date was not changed.';
 }
 if(warning)toast(warning,true);
}

document.addEventListener('pointerdown',e=>{
 const handle=e.target.closest('[data-timeline-handle]');if(!handle)return;
 const bar=handle.closest('[data-timeline-bar]');if(!bar)return;
 let operation=handle.dataset.timelineHandle;
 /* On a 12-month scale, one-day bars are very narrow and the resize hit areas can overlap the centre grip. Resolve the intended gesture from the pointer's actual position inside the bar. */
 if(bar.closest('.gantt-year-track')){
  const rect=bar.getBoundingClientRect(),localX=e.clientX-rect.left,edge=Math.min(8,Math.max(3,rect.width*.30));
  operation=localX<=edge?'start':localX>=rect.width-edge?'end':'move';
 }
 const ctx=timelineContext(bar,operation,e.clientX);if(!Number.isFinite(ctx.dayWidth)||ctx.dayWidth<=0)return;
 e.preventDefault();timelinePointer=ctx;bar.classList.add('is-adjusting');
});
document.addEventListener('pointermove',e=>{
 if(!timelinePointer)return;
 const delta=Math.round((e.clientX-timelinePointer.startX)/timelinePointer.dayWidth);
 timelinePointer.delta=delta;previewTimelineBar(timelinePointer,delta);
});
document.addEventListener('pointerup',async()=>{
 if(!timelinePointer)return;
 const ctx=timelinePointer;timelinePointer=null;ctx.bar.classList.remove('is-adjusting');
 if(ctx.delta)await commitTimelineEdit(ctx,ctx.delta);else render();
});
document.addEventListener('pointercancel',()=>{if(!timelinePointer)return;timelinePointer=null;render();});
document.addEventListener('keydown',async e=>{
 const handle=e.target.closest('[data-timeline-handle]');if(!handle)return;
 const delta=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!delta)return;
 e.preventDefault();e.stopPropagation();const bar=handle.closest('[data-timeline-bar]');if(!bar)return;
 const ctx=timelineContext(bar,handle.dataset.timelineHandle,0);await commitTimelineEdit(ctx,delta);
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer();closeMobileSidebar();return;}const tag=e.target.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||e.target.isContentEditable)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return;}if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if(k==='n'){e.preventDefault();newTaskModal({workspaceId:workspaceFilter==='all'?'professional':workspaceFilter});}if(k==='p'){e.preventDefault();newProjectModal({workspaceId:workspaceFilter==='all'?'professional':workspaceFilter});}if(k==='i')navigate('inbox');if(k==='d')navigate('today');if(k==='t')navigate('timeline');if(k==='w')navigate('weekly');if(k==='/'){e.preventDefault();openSearch();}});

init().catch(err=>{console.error(err);$('#content').innerHTML=emptyState('FOCUS could not start','Your local data could not be initialized. Try another browser or enable site storage.','!');});
